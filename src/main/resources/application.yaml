server:
  port: 8081
spring:
  application:
    name: vdt
  redis:
    host: localhost
    port: 6379
  datasource:
    url: jdbc:mariadb://localhost:3307/demo_db?createDatabaseIfNotExist=true
    username: root
    password: 555555
    driver-class-name: org.mariadb.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/demo-realm
          jwk-set-uri: http://localhost:8080/realms/demo-realm/protocol/openid-connect/certs
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

keycloak:
  server-url: http://localhost:8080
  realm: demo-realm
  admin:
    client-id: demo-client
#    client-secret:
    username: admin
    password: admin
    revoke-uri: http://localhost:8080/realms/demo-realm/protocol/openid-connect/revoke
  app-realm: demo-realm