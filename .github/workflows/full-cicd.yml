name: CI/CD Pipeline Standard

on:
  push:
    tags:
      - 'v*' # Chỉ kích hoạt khi có Tag

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Kéo mã nguồn về (Checkout)
      - name: Bước 1 - Kéo mã nguồn
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 11 trên máy chủ GitHub
      - name: Bước 2 - Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven' # Tự động cache thư viện giúp build nhanh hơn ở lần sau

      # Bước 3: Đóng gói file .jar bằng Maven
      - name: Bước 3 - Đóng gói file .jar
        run: mvn clean package -DskipTests

      # Bước 4: Đăng nhập Registry (Docker Hub)
      - name: Bước 4 - Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 5 & 6: Build Docker Image và Đẩy lên kho lưu trữ
      - name: Bước 5 & 6 - Build và Push Image
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vdt-app
          TAG: ${{ github.ref_name }}
        run: |
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG