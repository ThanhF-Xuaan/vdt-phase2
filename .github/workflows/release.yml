name: Build and Release to Docker Hub

# 1. KÍCH HOẠT (TRIGGER): Đường ống này sẽ chạy khi nào?
# Đáp án: Chỉ chạy khi có người đẩy lên một Git Tag bắt đầu bằng chữ 'v' (VD: v1.0.0, v2.1)
on:
  push:
    tags:
      - 'v*'

# 2. CÔNG VIỆC CẦN LÀM (JOBS)
jobs:
  build-and-push-image:
    # Mượn một con máy chủ của GitHub chạy hệ điều hành Ubuntu mới nhất để làm việc
    runs-on: ubuntu-latest

    # 3. CÁC BƯỚC THỰC HIỆN (STEPS)
    steps:
      # Bước 3.1: Tải toàn bộ Source Code & Dockerfile từ repo GitHub về con máy chủ Ubuntu
      - name: Bước 1 - Kéo mã nguồn về máy
        uses: actions/checkout@v4

      # Bước 3.2: Mở két sắt GitHub Secrets, lấy chìa khóa để đăng nhập Docker Hub
      - name: Bước 2 - Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 3.3: Dùng đúng các lệnh Docker bạn đã học để Build và Push
      - name: Bước 3 - Đóng gói và Đẩy lên mây (Build & Push)
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vdt-app
          # github.ref_name sẽ tự động lấy cái tên Tag (VD: v1.0.0) mà bạn vừa gõ
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          echo "Bắt đầu build image: $IMAGE_NAME:$TAG_VERSION"
          docker build -t $IMAGE_NAME:$TAG_VERSION .
          
          echo "Bắt đầu đẩy image lên Docker Hub"
          docker push $IMAGE_NAME:$TAG_VERSION